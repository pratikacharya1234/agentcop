[project]
name = "agentcop-detective"
version = "0.0.1"
description = "AgentCop detective: a quarantined reader that can only raise severity"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentcop_detective"]
