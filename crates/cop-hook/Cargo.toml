[package]
name = "cop-hook"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "cop-hook"
path = "src/main.rs"

[dependencies]
cop-core = { path = "../cop-core" }
cop-policy = { path = "../cop-policy" }
cop-evidence = { path = "../cop-evidence" }
cop-siren = { path = "../cop-siren" }
cop-taint = { path = "../cop-taint" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
sha2 = "0.10"

[dev-dependencies]
hmac = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"

