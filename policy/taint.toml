# Rule of Two rules (owner's semantics, 2026-10-27). A session that reads untrusted input, touches
# sensitive data and takes an external action is frozen. A frozen session blocks only external actions.
#
# Untrusted input is external data only: web results, MCP results, downloads (curl, wget), and files
# inside a repo the session cloned. A local read, grep or listing is not untrusted.
untrusted_tools = ["WebFetch", "WebSearch"]
# Tools that send data out, always external. Empty: nothing is external by name alone.
external_tools = []
# Web tools. Once the session holds a secret, they are external: a secret in the URL is data leaving.
network_tools = ["WebFetch", "WebSearch"]
# MCP tools whose names match one of these (case-insensitive) are external. Every MCP call is untrusted
# input. Other MCP tools become external once the session holds a secret.
mcp_send_patterns = ["send", "post", "create", "comment", "message", "email"]
# Tools that read a path. A path inside a cloned repo makes the read untrusted.
read_tools = ["Read", "Grep", "Glob"]
# Network tools. Once the session has touched sensitive data, each of these is an external action
# (a GET can carry the data in its URL, so even a plain request counts).
network_commands = ["curl", "wget", "nc", "ncat", "ssh", "scp", "sftp", "rsync", "ftp", "dig", "nslookup", "host", "telnet"]
# Bash commands that download (the output is data from outside) or clone a third-party repo.
untrusted_bash = ['\b(curl|wget)\b', '\bgit\s+clone\b']
# Secret files are recognised by file name in code (cop-shell secret.rs, FP-1 2026-10-26): `.env`, `.env.*`,
# `~/.ssh/*`, `~/.aws/credentials`, `id_rsa*`, `*.pem`, `hmac.key`. Regexes over text are not used for that.
# Matched against the raw command: a secret-looking value is sensitive wherever it is written.
sensitive_content = [
  'AKIA[0-9A-Z]{16}',
]
# External actions send data out: uploads (curl or wget with a body or a form, or a PUT/POST), network
# copy and remote shell tools, git push and clone, gh write commands, publish. A plain download is not.
external = [
  '(?:^|[\s;&|(\x22])(scp|sftp|rsync|nc|ncat|ssh|ftp)\b',
  '(?:^|[\s;&|(\x22])(curl|wget)\b.*(?:\s-(?:d|F|T)\b|\s--(?:data|form|upload-file|post-data|post-file)|\s-X\s*(?:POST|PUT|PATCH))',
  'git\s+(push|clone)\b',
  '\bgh\s+(pr|issue|gist|release)\b',
  '\b(npm|cargo)\s+publish\b',
]
# MCP tools (names starting mcp__) always count as external and untrusted.
