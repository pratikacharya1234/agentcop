# AgentCop default policy
# Rules are evaluated in order; strictest verdict wins (Deny > Ask > Allow)

# mode: "enforce" blocks; "log-only" allows every call and records what would have been blocked.
mode = "enforce"

# Recursive remove of root or home. Any flag order (-rf, -fr, -r -f, --recursive), optional quotes.
# Other paths are allowed. The judge matches JSON text, so quotes show up as \" and the target may be followed by \".
[[rules]]
pattern = '''rm\s+(?:-[a-zA-Z]+\s+|--[\w-]+\s+)*(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s+-[a-zA-Z]+|\s+--[\w-]+)*\s+\\?["']?(?:/|~/?)\*?(?:\\?["']|[\s;&|\\)]|$)'''
scope = "bash"
verdict = "deny"
reason = "Destructive remove on root or home"

# Production deletes
[[rules]]
pattern = "delete.*prod"
verdict = "deny"
reason = "Destructive action on production"

[[rules]]
pattern = "prod.*delete"
verdict = "deny"
reason = "Destructive action on production"

# Secret files
[[rules]]
pattern = "\\.env"
verdict = "deny"
reason = "Reading or writing secrets file"

[[rules]]
pattern = "\\.ssh"
verdict = "deny"
reason = "Accessing SSH keys"

[[rules]]
pattern = "AWS_SECRET|AZURE_KEY|GCP_KEY"
verdict = "deny"
reason = "Cloud credential exposure"

# Shell command injection
[[rules]]
pattern = "curl.*\\|.*sh"
verdict = "deny"
reason = "Piping untrusted data to shell"

[[rules]]
pattern = "wget.*\\|.*sh"
verdict = "deny"
reason = "Piping untrusted data to shell"

# Git operations (ask, not deny)
[[rules]]
pattern = "git\\s+push"
scope = "bash"
verdict = "ask"
reason = "Pushing code to repository"

[[rules]]
pattern = "git\\s+force-push"
scope = "bash"
verdict = "deny"
reason = "Force push is destructive"

# Stopping the cop: kill, pkill, killall, or systemctl on a cop process
[[rules]]
pattern = '\b(pkill|killall|kill)\b.*\b(copd|agentcop|cop-proxy|cop-cell|cop-daemon|cop-hook)\b'
scope = "bash"
verdict = "deny"
reason = "Attempt to stop the cop"

[[rules]]
pattern = 'systemctl\s+(stop|disable|mask|kill)\b.*\bcop'
scope = "bash"
verdict = "deny"
reason = "Attempt to stop the cop service"

# Cop state: writes to policy, evidence and config. Reads are allowed.
[[rules]]
pattern = '^(Edit|Write|MultiEdit|NotebookEdit) .*"file_path":"[^"]*(\.agentcop/|CLAUDE\.md|settings\.json|cop-(policy|evidence|hook|cli)|policy/)'
verdict = "deny"
reason = "Attempt to change cop state (policy, evidence or config)"

# Shell writes (redirect, tee, sed -i, rm, mv, cp, ...) that touch cop state or settings. Reads are allowed.
[[rules]]
pattern = '^Bash .*(>|\btee\b|\bsed\s+-i|\brm\b|\bmv\b|\bcp\b|\btruncate\b|\bshred\b|\bdd\b|\bchmod\b|\bchown\b|\bln\b).*(\.agentcop/|CLAUDE\.md|settings\.json|cop-(policy|evidence|hook|cli)|policy/)'
verdict = "deny"
reason = "Attempt to change cop state or settings"

# Honeytokens (planted decoys)
[[honeytokens]]
pattern = "FAKE_AWS_KEY_12345"
verdict = "deny"
reason = "Honeytoken triggered: suspect took the bait"

[[honeytokens]]
pattern = "canary\\.internal"
verdict = "deny"
reason = "Honeytoken triggered: canary database touched"
