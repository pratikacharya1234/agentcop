# AgentCop default policy
# Rules are evaluated in order; strictest verdict wins (Deny > Ask > Allow)

# mode: "enforce" blocks; "log-only" allows every call and records what would have been blocked.
mode = "enforce"

# Recursive remove of root or home. Any flag order (-rf, -fr, -r -f, --recursive), optional quotes.
# Other paths are allowed. The judge matches JSON text, so quotes show up as \" and the target may be followed by \".
[[rules]]
pattern = '''rm\s+(?:-[a-zA-Z]+\s+|--[\w-]+\s+)*(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s+-[a-zA-Z]+|\s+--[\w-]+)*\s+\\?["']?(?:/|~/?)\*?(?:\\?["']|[\s;&|\\)]|$)'''
scope = "bash"
verdict = "deny"
reason = "Destructive remove on root or home"

# Production deletes
[[rules]]
pattern = "delete.*prod"
verdict = "deny"
reason = "Destructive action on production"

[[rules]]
pattern = "prod.*delete"
verdict = "deny"
reason = "Destructive action on production"

# Secret files. Scoped to Bash: the judge matches what the command does (its executed words and
# write targets), not text inside heredocs or quotes. `.env.local`, `.env.production` etc. match `\.env\b`.
[[rules]]
pattern = "\\.env\\b"
scope = "bash"
verdict = "deny"
reason = "Reading or writing secrets file"

[[rules]]
pattern = "\\.ssh\\b"
scope = "bash"
verdict = "deny"
reason = "Accessing SSH keys"

# Other tools (Read, Edit, Write, ...) name the file in file_path. Only that field counts,
# so text inside another tool's content does not trigger these rules.
[[rules]]
pattern = '"file_path":"[^"]*\.env\b'
verdict = "deny"
reason = "Reading or writing secrets file"

[[rules]]
pattern = '"file_path":"[^"]*\.ssh\b'
verdict = "deny"
reason = "Accessing SSH keys"

[[rules]]
pattern = "AWS_SECRET|AZURE_KEY|GCP_KEY"
verdict = "deny"
reason = "Cloud credential exposure"

# Shell command injection
# Pipelines are matched as `pipe <stage> | <stage>` action lines.
[[rules]]
pattern = "curl.*\\|.*sh"
scope = "bash"
verdict = "deny"
reason = "Piping untrusted data to shell"

[[rules]]
pattern = "wget.*\\|.*sh"
scope = "bash"
verdict = "deny"
reason = "Piping untrusted data to shell"

# Git operations (ask, not deny)
[[rules]]
pattern = "git\\s+push"
scope = "bash"
verdict = "ask"
reason = "Pushing code to repository"

[[rules]]
pattern = "git\\s+force-push"
scope = "bash"
verdict = "deny"
reason = "Force push is destructive"

# Stopping the cop: kill, pkill, killall, or systemctl on a cop process
[[rules]]
pattern = '\b(pkill|killall|kill)\b.*\b(copd|agentcop|cop-proxy|cop-cell|cop-daemon|cop-hook)\b'
scope = "bash"
verdict = "deny"
reason = "Attempt to stop the cop"

[[rules]]
pattern = 'systemctl\s+(stop|disable|mask|kill)\b.*\bcop'
scope = "bash"
verdict = "deny"
reason = "Attempt to stop the cop service"

# Cop state (installed copy only): ~/.agentcop/ (policy, evidence, hook, sessions) and the Claude
# Code settings that hold the hook. Repo sources such as policy/default.toml are normal development.
# Edit and Write name the file in file_path (raw JSON text).
[[rules]]
pattern = '^(Edit|Write|MultiEdit|NotebookEdit) .*"file_path":"(?:~|/home/[^/"]+|/root)/(?:\.agentcop/|\.claude/settings(?:\.local)?\.json")'
verdict = "deny"
reason = "Attempt to change cop state (policy, evidence or config)"

# Bash: a write action (redirect, tee, sed -i, rm, mv, cp, ...) whose target is installed cop state.
# Reads, stderr redirects (2>&1, 2>/dev/null) and repo paths are not writes to cop state.
[[rules]]
pattern = '^write (?:~|/home/[^/\s]+|/root)/(?:\.agentcop(?:/|$)|\.claude/settings(?:\.local)?\.json$)'
scope = "bash"
verdict = "deny"
reason = "Attempt to change cop state or settings"

# Uncertain: the command runs something we cannot read statically (a name built by $( ), a variable
# or a backtick; eval of a variable; decoded payloads; text piped into a shell or interpreter).
# Ask, never allow. A rule that denies the same command still wins (strictest verdict).
[[rules]]
pattern = '^uncertain '
scope = "bash"
verdict = "ask"
reason = "Cannot tell statically what this command runs"

# find -delete: the target is find's start path. `find . -name '*.log' -delete` is allowed.
# The root or the home directory is denied; another absolute path, or a path outside the project, asks.
[[rules]]
pattern = '^find-delete (?:/|~/?)$'
scope = "bash"
verdict = "deny"
reason = "Deleting from the root or the home directory"

[[rules]]
pattern = '^find-delete (?:/|~|\.\.)'
scope = "bash"
verdict = "ask"
reason = "Deleting outside the project directory"

# After the session has read a secret, running code and fetching packages ask. The secret may be in the
# code's arguments, its network traffic or the package it pulls. A session with no secret is not affected.
[[rules]]
pattern = '^exec (?:python[\d.]*|node|ruby|perl|php|lua)\b'
scope = "bash"
verdict = "ask"
requires_secret = true
reason = "Running code after the session read a secret"

[[rules]]
pattern = '^exec (?:npm|npx|yarn|pnpm|pip[\d.]*|cargo)\s+(?:install|i|ci|add|update|fetch|download|run)\b'
scope = "bash"
verdict = "ask"
requires_secret = true
reason = "Fetching or running packages after the session read a secret"

[[rules]]
pattern = '^exec git\s+(?:fetch|clone|pull)\b'
scope = "bash"
verdict = "ask"
requires_secret = true
reason = "Fetching a repository after the session read a secret"

# Inline code (python -c, node -e, perl -e, sqlite3, sh script) that names protected state: deny.
# Code that does not name protected state stays allowed; that is a known limit (see THREAT_MODEL).
[[rules]]
pattern = '^inline .*(\.agentcop|\.claude/settings)'
scope = "bash"
verdict = "deny"
reason = "Inline code touches protected state"

# Project instructions (CLAUDE.md) are read by the agent in later sessions: ask before any change.
[[rules]]
pattern = '"file_path":"[^"]*CLAUDE\.md"'
verdict = "ask"
reason = "Changing project instructions (CLAUDE.md)"

[[rules]]
pattern = '^write (?:.*/)?CLAUDE\.md$'
scope = "bash"
verdict = "ask"
reason = "Changing project instructions (CLAUDE.md)"

# Project Claude Code settings: ask before any change. A change that removes or alters the AgentCop
# hook entry is denied by the judge's hook-entry guard (cop-policy), not by this rule.
[[rules]]
pattern = '"file_path":"[^"]*\.claude/settings(?:\.local)?\.json"'
verdict = "ask"
reason = "Changing project Claude Code settings"

[[rules]]
pattern = '^write (?:.*/)?\.claude/settings(?:\.local)?\.json$'
scope = "bash"
verdict = "ask"
reason = "Changing project Claude Code settings"

# Redaction before storage: the built-in patterns are in redact.toml (compiled into the binary). Add your own
# [[redact]] tables here; `redact = "off"` removes all of them (the hook prints a loud warning).

# Honeytokens (planted decoys)
[[honeytokens]]
pattern = "FAKE_AWS_KEY_12345"
verdict = "deny"
reason = "Honeytoken triggered: suspect took the bait"

[[honeytokens]]
pattern = "canary\\.internal"
verdict = "deny"
reason = "Honeytoken triggered: canary database touched"
