[workspace]
resolver = "2"
members = [
  "crates/cop-core",
  "crates/cop-policy",
  "crates/cop-evidence",
  "crates/cop-hook",
  "crates/cop-cli",
  "crates/cop-siren",
  "crates/cop-logger",
  "crates/cop-normalizer",
  "crates/cop-codex",
  "crates/cop-honeypot",
  "crates/cop-ratelimit",
  "crates/cop-pipeline",
  "crates/cop-ebpf",
  "crates/cop-family",
  "crates/cop-syscalls",
  "crates/cop-egress",
  "crates/cop-holding",
  "crates/cop-case",
  "crates/cop-detective",
  "crates/cop-fixer",
  "crates/cop-affairs",
  "crates/cop-courtroom",
  "crates/cop-community",
  "crates/cop-rules",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Pratik Acharya <acharyapratik214@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pratik214/agentcop"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
