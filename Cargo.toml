[workspace]
resolver = "2"
members = [
  "crates/cop-core",
  "crates/cop-policy",
  "crates/cop-evidence",
  "crates/cop-hook",
  "crates/cop-cli",
  "crates/cop-siren",
  "crates/cop-shell",
  "crates/cop-taint",
]
# Crates that no live binary depends on. They are kept as standalone packages (each has its own
# [workspace] table) so they can be built and tested on their own, but they are not part of the
# AgentCop build and not part of the release. See crates/experimental/EXPERIMENTAL.md.
exclude = [
  "crates/experimental/cop-bundle",
  "crates/experimental/cop-cell",
  "crates/experimental/cop-codex",
  "crates/experimental/cop-ebpf",
  "crates/experimental/cop-family",
  "crates/experimental/cop-honeypot",
  "crates/experimental/cop-logger",
  "crates/experimental/cop-normalizer",
  "crates/experimental/cop-pipeline",
  "crates/experimental/cop-proxy",
  "crates/experimental/cop-ratelimit",
  "crates/experimental/cop-syscalls",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Pratik Acharya <acharyapratik214@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pratikacharya1234/agentcop"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
